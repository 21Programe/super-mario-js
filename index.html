<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Super JS Bros — Ultra Edition</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="game-wrapper">
  <canvas id="gameCanvas" aria-label="Jogo Super JS Bros"></canvas>
  <header id="hud">
    <div><b>WORLD</b><span id="worldDisplay">1-1</span></div>
    <div><b>SCORE</b><span id="scoreDisplay">000000</span></div>
    <div><b>COINS</b><span id="coinDisplay">x00</span></div>
    <div><b>TIME</b><span id="timeDisplay">300</span></div>
    <div><b>LIVES</b><span id="livesDisplay">x03</span></div>
  </header>
  <section id="menu" class="screen">
    <h1>SUPER JS BROS</h1><p>ULTRA EDITION</p>
    <button id="startBtn">JOGAR</button>
    <small>Setas / WASD • Espaço = pular • Shift = correr • Gamepad • Touch</small>
  </section>
  <section id="pause" class="screen hidden"><h2>PAUSADO</h2><button id="resumeBtn">CONTINUAR</button></section>
  <section id="gameOver" class="screen hidden"><h2>GAME OVER</h2><button id="restartBtn">TENTAR NOVAMENTE</button></section>
  <section id="victory" class="screen hidden"><h2>FASE CONCLUÍDA!</h2><button id="nextBtn">PRÓXIMA FASE</button></section>
  <div id="touch-controls"><button id="btn-left">◀</button><button id="btn-right">▶</button><button id="btn-run">●</button><button id="btn-jump">▲</button></div>
</main>
<script type="module" src="script.js"></script>
</body>
</html>
